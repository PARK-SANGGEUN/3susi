<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 입시결과 3개년 비교 온도계</title>

<style>
body{
  margin:0;
  font-family: Pretendard, Apple SD Gothic Neo, Arial;
  background: linear-gradient(135deg,#eef2ff,#fdf2f8);
}
.container{
  max-width:1200px;
  margin:30px auto;
  padding:30px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
}
h1{margin:0;font-size:34px}
.sub{margin-top:6px;font-weight:600}
.badge{
  display:inline-block;
  padding:10px 18px;
  border-radius:30px;
  background:linear-gradient(90deg,#fde047,#ef4444);
  color:#000;
  font-weight:700;
  margin-top:10px;
}
.help{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:#f1f5f9;
  font-size:14px;
}
.selects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-top:20px;
}
select,button{
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:15px;
}
button.primary{
  background:#fde047;
  font-weight:700;
  border:none;
}
.compare{
  margin-top:30px;
}
.card{
  border-radius:20px;
  padding:20px;
  background:#f8fafc;
  margin-bottom:20px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  text-align:center;
}
th{
  background:#e0e7ff;
}
tr.highlight{
  background:#fff3c4;
  font-weight:700;
}
.gauges{
  display:flex;
  gap:20px;
  justify-content:center;
  margin-top:20px;
}
.gauge{
  width:70px;
  height:240px;
  background:#e5e7eb;
  border-radius:40px;
  position:relative;
}
.fill{
  position:absolute;
  bottom:0;
  width:100%;
  border-radius:40px;
}
.scale{
  position:absolute;
  right:-30px;
  font-size:12px;
}
.scale div{height:24px}
.marker{
  position:absolute;
  left:0;
  width:100%;
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:#000;
}
</style>
</head>

<body>
<div class="container">
  <h1>모두의 입시결과 3개년 비교 온도계</h1>
  <div class="sub">Copyright@All Teachers</div>
  <div class="badge">출처: 어디가 3개년 입시결과</div>

  <div class="help">
    ① 대학 → ② 모집단위 → ③ 전형 선택 → ④ 세부 전형 선택<br>
    최대 3개까지 비교 가능 / 2025년 데이터는 강조 표시
  </div>

  <div class="selects">
    <select id="univ"></select>
    <select id="major"></select>
    <select id="track"></select>
    <select id="type"></select>
    <button class="primary" onclick="addCompare()">비교 추가 (최대 3)</button>
  </div>

  <div class="compare" id="compare"></div>
</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbz_nkDgCK8-tPgvEFR-QAzzAxE9Dke7udddR68y7CIOEs4JZe8B2VWDvMuu_CdBzzsi/exec";
var DATA = {};
var selected = JSON.parse(localStorage.getItem("compare") || "[]");

fetch(API).then(function(r){return r.json()}).then(function(d){
  DATA = d;
  init();
});

function init(){
  var u = document.getElementById("univ");
  u.innerHTML = "<option>대학 선택</option>";
  var y = DATA["2025"];
  for(var k in y) u.innerHTML += "<option>"+k+"</option>";
}

document.getElementById("univ").onchange=function(){
  var m=document.getElementById("major");
  m.innerHTML="<option>모집단위</option>";
  var y=DATA["2025"][this.value]||{};
  for(var k in y) m.innerHTML+="<option>"+k+"</option>";
};

document.getElementById("major").onchange=function(){
  var t=document.getElementById("track");
  t.innerHTML="<option>전형 선택</option>";
  var u=document.getElementById("univ").value;
  var y=DATA["2025"][u][this.value]||{};
  for(var k in y) t.innerHTML+="<option>"+k+"</option>";
};

document.getElementById("track").onchange=function(){
  var ty=document.getElementById("type");
  ty.innerHTML="<option>세부 전형</option>";
  var u=univ.value,m=major.value;
  var y=DATA["2025"][u][m][this.value]||{};
  for(var k in y) ty.innerHTML+="<option>"+k+"</option>";
};

function scoreToHeight(v){
  if(!v) return 0;
  return Math.max(10,(9-v)*11);
}

function addCompare(){
  if(selected.length>=3) return alert("최대 3개");
  selected.push({
    u:univ.value,m:major.value,t:track.value,ty:type.value
  });
  localStorage.setItem("compare",JSON.stringify(selected));
  render();
}

function render(){
  var box=document.getElementById("compare");
  box.innerHTML="";
  for(var i=0;i<selected.length;i++){
    var s=selected[i];
    var html="<div class='card'><b>"+s.u+" / "+s.m+"</b>";
    html+="<table><tr><th>연도</th><th>70%cut</th></tr>";
    var years=["2025","2024","2023"];
    html+="</table><div class='gauges'>";
    for(var y=0;y<years.length;y++){
      var r=DATA[years[y]][s.u][s.m][s.t][s.ty];
      var h=scoreToHeight(r.cut70);
      var color=y==0?"linear-gradient(#ef4444,#fde047)":
                y==1?"linear-gradient(#22c55e,#bbf7d0)":
                      "linear-gradient(#3b82f6,#bfdbfe)";
      html+="<div class='gauge'><div class='fill' style='height:"+h+"%;background:"+color+"'></div>";
      html+="<div class='marker' style='bottom:"+h+"%'>"+r.cut70+"</div></div>";
    }
    html+="</div></div>";
    box.innerHTML+=html;
  }
}
render();
</script>
</body>
</html>
