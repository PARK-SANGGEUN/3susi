<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 입시결과 3개년 비교 온도계</title>

<style>
:root{
  --bg:#f6f4fb;
  --card:#ffffff;
  --primary:#6c63ff;
  --accent:#ffb703;
  --text:#1f2937;
  --muted:#6b7280;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(135deg,#eef2ff,#fdf2f8);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:40px auto;
  padding:24px;
  background:rgba(255,255,255,.85);
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}

h1{margin:0;font-size:32px}
.subtitle{margin-top:6px;font-weight:700}
.badge{
  display:inline-block;
  margin-left:12px;
  padding:6px 14px;
  border-radius:999px;
  background:linear-gradient(90deg,#ffb703,#fb8500);
  color:#000;
  font-weight:700;
}

.guide{
  margin:20px 0;
  padding:14px 18px;
  border-radius:14px;
  background:#f1f5f9;
  font-size:14px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
}

select,button{
  padding:14px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  font-size:15px;
}

button.primary{
  background:linear-gradient(90deg,#facc15,#fb8500);
  border:none;
  font-weight:800;
  cursor:pointer;
}

button.ghost{
  background:#e5e7eb;
  border:none;
  cursor:pointer;
}

.compare-list{
  margin-top:30px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
}

.table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
}
.table th,.table td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
}

.table tr.highlight{
  background:#fff7ed;
  font-weight:800;
}

.gauges{
  display:flex;
  gap:20px;
  margin-top:18px;
}

.gauge{
  flex:1;
  height:220px;
  background:#e5e7eb;
  border-radius:999px;
  position:relative;
  overflow:hidden;
}

.fill{
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:#fff;
  font-weight:800;
}

.year-label{
  position:absolute;
  top:8px;
  width:100%;
  text-align:center;
  font-weight:700;
  color:#374151;
}

@media(max-width:768px){
  .gauges{flex-direction:column}
}
</style>
</head>

<body>
<div class="container">

  <h1>모두의 입시결과 3개년 비교 온도계
    <span class="badge">출처: 어디가 3개년 입시결과</span>
  </h1>
  <div class="subtitle">Copyright@All Teachers</div>

  <div class="guide">
    ① 대학 → ② 모집단위 → ③ 전형 선택 → ④ 세부 전형 선택<br/>
    • 최대 3개까지 비교 가능 / 새로고침해도 유지됩니다.
  </div>

  <div class="controls">
    <select id="univ"><option>대학 선택</option></select>
    <select id="major"><option>모집단위</option></select>
    <select id="track"><option>전형 선택</option></select>
    <select id="type"><option>세부 전형</option></select>
    <button class="primary" id="add">비교 추가 (최대 3)</button>
    <button class="ghost" id="reset">초기화</button>
  </div>

  <div class="compare-list" id="list"></div>

</div>

<script>
const DATA_URL="https://script.google.com/macros/s/AKfycbz_nkDgCK8-tPgvEFR-QAzzAxE9Dke7udddR68y7CIOEs4JZe8B2VWDvMuu_CdBzzsi/exec";
let DATA={}, selected=[];

const univ=document.getElementById("univ");
const major=document.getElementById("major");
const track=document.getElementById("track");
const type=document.getElementById("type");
const list=document.getElementById("list");

fetch(DATA_URL).then(r=>r.json()).then(d=>{
  DATA=d;
  Object.keys(DATA["2025"]).forEach(u=>univ.add(new Option(u,u)));
  restore();
});

univ.onchange=()=>{
  major.length=1;
  track.length=1;
  type.length=1;
  Object.keys(DATA["2025"][univ.value]||{}).forEach(m=>major.add(new Option(m,m)));
};

major.onchange=()=>{
  track.length=1;
  type.length=1;
  Object.keys(DATA["2025"][univ.value][major.value]||{}).forEach(t=>track.add(new Option(t,t)));
};

track.onchange=()=>{
  type.length=1;
  Object.keys(DATA["2025"][univ.value][major.value][track.value]||{}).forEach(p=>type.add(new Option(p,p)));
};

document.getElementById("add").onclick=()=>{
  if(selected.length>=3)return alert("최대 3개까지");
  const key=[univ.value,major.value,track.value,type.value].join("|");
  if(selected.includes(key))return;
  selected.push(key);
  save();
  render();
};

document.getElementById("reset").onclick=()=>{
  selected=[];
  save();
  render();
};

function save(){localStorage.setItem("compare",JSON.stringify(selected))}
function restore(){
  selected=JSON.parse(localStorage.getItem("compare")||"[]");
  render();
}

function render(){
  list.innerHTML="";
  selected.forEach(k=>{
    const [u,m,t,p]=k.split("|");
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-header">
        ${u} / ${m} / ${p}
        <button onclick="remove('${k}')">❌</button>
      </div>
      ${makeTable(u,m,t,p)}
      ${makeGauges(u,m,t,p)}
    `;
    list.appendChild(card);
  });
}

function remove(k){
  selected=selected.filter(x=>x!==k);
  save();render();
}

function makeTable(u,m,t,p){
  const years=["2025","2024","2023"];
  let rows=years.map(y=>{
    const r=DATA[y]?.[u]?.[m]?.[t]?.[p]||{};
    return `<tr class="${y==='2025'?'highlight':''}">
      <td>${y}</td>
      <td>${r.quota||"-"}</td>
      <td>${r.ratio||"-"}</td>
      <td>${r.rank||"-"}</td>
      <td>${r.cut50||"-"}</td>
      <td>${r.cut70||"-"}</td>
    </tr>`;
  }).join("");
  return `<table class="table">
    <tr><th>연도</th><th>모집인원</th><th>경쟁률</th><th>충원</th><th>50%</th><th>70%</th></tr>
    ${rows}
  </table>`;
}

function makeGauges(u,m,t,p){
  const years=["2025","2024","2023"];
  return `<div class="gauges">`+years.map(y=>{
    const v=DATA[y]?.[u]?.[m]?.[t]?.[p]?.cut70;
    const h=v?Math.max(10,(9-v)/8*100):5;
    const color=y==="2025"?"linear-gradient(#fb8500,#f97316)":
                y==="2024"?"linear-gradient(#22c55e,#16a34a)":
                "linear-gradient(#3b82f6,#2563eb)";
    return `<div class="gauge">
      <div class="year-label">${y}</div>
      <div class="fill" style="height:${h}%;background:${color}">
        ${v||"-"}
      </div>
    </div>`;
  }).join("")+`</div>`;
}
</script>
</body>
</html>
