<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 수시 3개년 입시결과 비교 온도계</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --primary:#ffb703;
  --blue:#4dabf7;
  --yellow:#ffd43b;
  --red:#ff6b6b;
  --gray:#dee2e6;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: Pretendard, Apple SD Gothic Neo, sans-serif;
  background:linear-gradient(180deg,#f3f4ff,#fff);
}
.container{
  max-width:1200px;
  margin:40px auto;
  padding:24px;
}
.card{
  background:var(--card);
  border-radius:20px;
  padding:32px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}
h1{margin:0;font-size:28px}
.subtitle{margin-top:6px;font-weight:600}
.badge{
  display:inline-block;
  margin-top:14px;
  padding:8px 14px;
  border-radius:999px;
  background:linear-gradient(90deg,#ffd43b,#ff6b6b);
  font-weight:700;
}
.guide{
  margin-top:16px;
  background:#f1f3f5;
  padding:12px 16px;
  border-radius:12px;
  font-size:14px;
}
.selects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:20px;
}
select,button{
  padding:14px;
  border-radius:12px;
  border:1px solid var(--gray);
  font-size:15px;
}
button.primary{
  background:var(--primary);
  border:none;
  font-weight:700;
  cursor:pointer;
}
button:disabled,select:disabled{
  opacity:.5;
}
.progress-wrap{
  margin-top:24px;
  display:none;
}
.progress{
  height:8px;
  background:#e9ecef;
  border-radius:8px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#4dabf7,#ff6b6b);
  transition:width .4s;
}
.loading-text{
  margin-top:8px;
  font-size:13px;
  color:#555;
}
.compare-area{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}
.compare-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 20px rgba(0,0,0,.06);
  position:relative;
}
.remove{
  position:absolute;
  top:12px;
  right:14px;
  cursor:pointer;
  font-weight:900;
}
.thermo{
  margin-top:16px;
  height:220px;
}
@media(max-width:600px){
  h1{font-size:22px}
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>모두의 수시 3개년 입시결과 비교 온도계</h1>
    <div class="subtitle">Copyright@All Teachers</div>
    <div class="badge">출처 : 어디가 3개년 입시결과</div>

    <div class="guide">
      ① 대학 → ② 모집단위 → ③ 전형 → ④ 세부전형 선택<br>
      최대 3개 비교 가능 · 2025년 데이터 강조
    </div>

    <div class="selects">
      <select id="univ" disabled><option>로딩 중...</option></select>
      <select id="dept" disabled><option>모집단위</option></select>
      <select id="track" disabled><option>전형</option></select>
      <select id="detail" disabled><option>세부전형</option></select>
      <button class="primary" id="addBtn" disabled>비교 추가 (최대 3)</button>
    </div>

    <div class="progress-wrap" id="loader">
      <div class="progress">
        <div class="progress-bar" id="bar"></div>
      </div>
      <div class="loading-text" id="loadingText">데이터 불러오는 중...</div>
    </div>

    <div class="compare-area" id="compareArea"></div>
  </div>
</div>

<script>
/* ================= 기본 설정 ================= */
const GAS_URL = "https://script.google.com/macros/s/AKfycbw4cVu8rVN-EjUv1XIBQ0xWAnv0Rd9gl4q-2Oyxa9vSOEcl0cqONZWAcqAMsDE4CxY/exec";
const YEARS = [2025,2024,2023];
const CACHE_KEY = "admissionDataV1";
const CACHE_TIME = 1000*60*60*8;

/* ================= 상태 ================= */
let DATA = null;
let selected = [];

/* ================= 로딩 UI ================= */
const loader = document.getElementById("loader");
const bar = document.getElementById("bar");
const loadingText = document.getElementById("loadingText");

function showLoader(){
  loader.style.display="block";
  let p=0;
  const t=setInterval(()=>{
    p=Math.min(p+5,90);
    bar.style.width=p+"%";
  },300);
  loader._t=t;
}
function hideLoader(){
  clearInterval(loader._t);
  bar.style.width="100%";
  setTimeout(()=>loader.style.display="none",500);
}

/* ================= 데이터 로드 ================= */
async function loadData(){
  showLoader();

  const cached = localStorage.getItem(CACHE_KEY);
  if(cached){
    const {time,data}=JSON.parse(cached);
    if(Date.now()-time<CACHE_TIME){
      DATA=data;
      hideLoader();
      initUI();
      return;
    }
  }

  const res = await fetch(GAS_URL);
  const json = await res.json();

  DATA=json;
  localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),data:json}));
  hideLoader();
  initUI();
}

/* ================= UI 초기화 ================= */
function initUI(){
  const univSel=document.getElementById("univ");
  univSel.innerHTML='<option value="">대학 선택</option>';
  Object.keys(DATA[2025]).forEach(u=>{
    univSel.add(new Option(u,u));
  });
  enable(univSel);
}

/* ================= 헬퍼 ================= */
function enable(el){el.disabled=false}
function disable(el){el.disabled=true}

/* ================= 이벤트 ================= */
document.getElementById("univ").onchange=e=>{
  const u=e.target.value;
  const dept=document.getElementById("dept");
  dept.innerHTML='<option value="">모집단위</option>';
  if(!u)return;
  Object.keys(DATA[2025][u]).forEach(d=>dept.add(new Option(d,d)));
  enable(dept);
};

document.getElementById("dept").onchange=e=>{
  const u=univ.value,d=e.target.value;
  const track=document.getElementById("track");
  track.innerHTML='<option value="">전형</option>';
  if(!d)return;
  Object.keys(DATA[2025][u][d]).forEach(t=>track.add(new Option(t,t)));
  enable(track);
};

document.getElementById("track").onchange=e=>{
  const u=univ.value,d=dept.value,t=e.target.value;
  const det=document.getElementById("detail");
  det.innerHTML='<option value="">세부전형</option>';
  if(!t)return;
  Object.keys(DATA[2025][u][d][t]).forEach(x=>det.add(new Option(x,x)));
  enable(det);
  enable(addBtn);
};

/* ================= 온도계 ================= */
function thermo(value){
  const pct=Math.max(0,Math.min(100,(10-value)*10));
  return `
<svg viewBox="0 0 60 200" class="thermo">
<defs>
<linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
<stop offset="0%" stop-color="#4dabf7"/>
<stop offset="50%" stop-color="#ffd43b"/>
<stop offset="100%" stop-color="#ff6b6b"/>
</linearGradient>
</defs>
<rect x="20" y="10" width="20" height="160" rx="10" fill="#eee"/>
<rect x="20" y="${170-pct*1.6}" width="20" height="${pct*1.6}" rx="10" fill="url(#g)">
<animate attributeName="height" from="0" to="${pct*1.6}" dur="0.8s"/>
</rect>
<text x="30" y="${165-pct*1.6}" text-anchor="middle" font-size="12">${value}</text>
</svg>`;
}

/* ================= 시작 ================= */
loadData();
</script>
</body>
</html>
