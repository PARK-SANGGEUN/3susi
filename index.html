<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>모두의 수시 3개년 입시결과 비교 온도계</title>

<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --main:#ffb703;
  --text:#1f2937;
  --muted:#6b7280;
}

*{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont;}
body{margin:0;background:linear-gradient(180deg,#eef2ff,#fdf2f8);}

.container{max-width:1200px;margin:40px auto;padding:20px;}
.card{
  background:var(--card);
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}

h1{margin:0;font-size:32px;}
.subtitle{margin-top:6px;font-weight:700;}
.badge{
  display:inline-block;
  margin-top:12px;
  padding:8px 14px;
  border-radius:999px;
  background:linear-gradient(90deg,#fbbf24,#f87171);
  color:#111;
  font-weight:700;
}

.help{
  margin-top:18px;
  background:#f1f5f9;
  padding:14px 18px;
  border-radius:14px;
  color:#334155;
  font-size:14px;
}

.selects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr)) auto;
  gap:12px;
  margin-top:20px;
}

select,button{
  padding:14px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  font-size:15px;
}
button{
  background:var(--main);
  border:none;
  font-weight:800;
  cursor:pointer;
}

#progressWrap{
  margin-top:20px;
  display:none;
}
#progress{
  height:10px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
}
#bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#60a5fa,#22c55e);
  transition:width .3s;
}

.results{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.compareCard{
  background:#f8fafc;
  border-radius:20px;
  padding:18px;
  position:relative;
}
.compareCard h3{margin:0 0 8px 0;font-size:16px;}
.remove{
  position:absolute;
  top:12px;right:12px;
  background:#ef4444;color:#fff;
  border:none;border-radius:999px;
  width:26px;height:26px;
  cursor:pointer;
}

.table{
  font-size:14px;
  margin-top:10px;
}
.table div{display:flex;justify-content:space-between;padding:4px 0;}

.thermo{
  margin-top:16px;
  height:220px;
  width:60px;
  background:#e5e7eb;
  border-radius:999px;
  position:relative;
}
.fill{
  position:absolute;
  bottom:0;
  width:100%;
  border-radius:999px;
  background:linear-gradient(180deg,#22c55e,#facc15,#ef4444);
}
.scale{
  position:absolute;
  right:-38px;
  top:0;
  height:100%;
  font-size:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.scale span{color:#374151;}

@media(max-width:600px){
  h1{font-size:24px;}
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>모두의 수시 3개년 입시결과 비교 온도계</h1>
    <div class="subtitle">Copyright@All Teachers</div>
    <div class="badge">출처: 어디가 3개년 입시결과</div>

    <div class="help">
      ① 대학 → ② 모집단위 → ③ 전형 → ④ 세부전형 선택<br/>
      최대 3개까지 비교 가능 · 2025년 데이터 강조
    </div>

    <div class="selects">
      <select id="univ"><option>대학 선택</option></select>
      <select id="dept"><option>모집단위</option></select>
      <select id="type"><option>전형</option></select>
      <select id="detail"><option>세부전형</option></select>
      <button id="add">비교 추가 (최대 3)</button>
    </div>

    <div id="progressWrap">
      <div id="progress"><div id="bar"></div></div>
    </div>

    <div class="results" id="results"></div>
  </div>
</div>

<script>
const DATA_URL =
"https://script.google.com/macros/s/AKfycbw4cVu8rVN-EjUv1XIBQ0xWAnv0Rd9gl4q-2Oyxa9vSOEcl0cqONZWAcqAMsDE4CxY/exec";

let RAW=null;
let selected=[];

const bar=p=>document.getElementById("bar").style.width=p+"%";

async function loadData(){
  document.getElementById("progressWrap").style.display="block";
  bar(10);
  const res=await fetch(DATA_URL);
  bar(40);
  RAW=await res.json();
  bar(100);
  setTimeout(()=>document.getElementById("progressWrap").style.display="none",500);
  initUniv();
}

function initUniv(){
  const u=document.getElementById("univ");
  Object.keys(RAW).forEach(v=>u.add(new Option(v,v)));
}

function clear(sel){sel.length=1;}

univ.onchange=()=>{
  clear(dept);clear(type);clear(detail);
  Object.keys(RAW[univ.value]).forEach(v=>dept.add(new Option(v,v)));
};

dept.onchange=()=>{
  clear(type);clear(detail);
  Object.keys(RAW[univ.value][dept.value]).forEach(v=>type.add(new Option(v,v)));
};

type.onchange=()=>{
  clear(detail);
  Object.keys(RAW[univ.value][dept.value][type.value])
    .forEach(v=>detail.add(new Option(v,v)));
};

add.onclick=()=>{
  if(selected.length>=3)return alert("최대 3개까지");
  const d=RAW[univ.value][dept.value][type.value][detail.value];
  selected.push({univ:univ.value,dept:dept.value,type:type.value,detail:detail.value,data:d});
  render();
};

function render(){
  const wrap=document.getElementById("results");
  wrap.innerHTML="";
  selected.forEach((s,i)=>{
    const cut=s.data.cut70||9;
    const level=Math.min(9,Math.max(1,cut));
    const h=(10-level)/9*100;

    wrap.innerHTML+=`
    <div class="compareCard">
      <button class="remove" onclick="selected.splice(${i},1);render()">×</button>
      <h3>${s.univ}<br>${s.dept}</h3>
      <div class="table">
        <div><span>경쟁률</span><span>${s.data.ratio}</span></div>
        <div><span>70%컷</span><span>${cut}</span></div>
      </div>
      <div class="thermo">
        <div class="fill" style="height:${h}%"></div>
        <div class="scale">
          <span>1</span><span>3</span><span>5</span><span>7</span><span>9</span>
        </div>
      </div>
    </div>`;
  });
}

loadData();
</script>
</body>
</html>
