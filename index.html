<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 수시 3개년 입시결과 비교 온도계</title>

<style>
:root{
  --blue:#3b82f6;
  --yellow:#facc15;
  --red:#ef4444;
  --bg:#f5f6ff;
  --card:#ffffff;
  --text:#111827;
}

*{box-sizing:border-box;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}

.container{
  max-width:1200px;
  margin:32px auto;
  padding:24px;
  background:linear-gradient(135deg,#fff,#fdf2f8);
  border-radius:28px;
  box-shadow:0 30px 60px rgba(0,0,0,.12);
}

h1{margin:0;font-size:32px}
.sub{font-weight:600;margin-top:6px}
.badge{
  display:inline-block;
  margin-top:12px;
  padding:8px 14px;
  border-radius:999px;
  background:linear-gradient(90deg,#facc15,#ef4444);
  color:#111;
  font-weight:700;
}

.guide{
  margin:16px 0;
  padding:14px 18px;
  background:#f3f4f6;
  border-radius:16px;
  font-size:14px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr auto;
  gap:12px;
  margin-top:16px;
}

select,button{
  padding:14px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  font-size:15px;
}

button{
  background:#fbbf24;
  border:none;
  font-weight:700;
  cursor:pointer;
}

button:disabled{opacity:.5;cursor:not-allowed}

.progress-wrap{
  margin-top:16px;
}
.progress{
  height:8px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red));
  transition:width .3s ease;
}
.progress-text{font-size:13px;margin-top:6px}

.compare-area{
  margin-top:24px;
  display:grid;
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:20px;
  box-shadow:0 12px 28px rgba(0,0,0,.1);
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:700;
}

.remove{cursor:pointer;color:#ef4444}

.thermos{
  display:flex;
  gap:24px;
  margin-top:16px;
}

.thermo{
  width:80px;
  height:260px;
}

@media(max-width:768px){
  .controls{grid-template-columns:1fr}
  .thermos{justify-content:center}
}
</style>
</head>

<body>
<div class="container">

<h1>모두의 수시 3개년 입시결과 비교 온도계</h1>
<div class="sub">Copyright@All Teachers</div>
<div class="badge">출처: 어디가 3개년 입시결과</div>

<div class="guide">
① 대학 → ② 모집단위 → ③ 전형 → ④ 세부전형 선택<br>
최대 3개 비교 가능 · 2025 데이터 강조
</div>

<div class="controls">
<select id="univ" disabled><option>로딩 중...</option></select>
<select id="dept" disabled><option>모집단위</option></select>
<select id="type" disabled><option>전형</option></select>
<select id="detail" disabled><option>세부전형</option></select>
<button id="add" disabled>비교 추가 (최대 3)</button>
</div>

<div class="progress-wrap">
  <div class="progress"><span id="bar"></span></div>
  <div class="progress-text" id="ptext">데이터 불러오는 중...</div>
</div>

<div class="compare-area" id="cards"></div>

</div>

<script>
/* ================= 설정 ================= */
const GAS_URL =
"https://script.google.com/macros/s/AKfycbw4cVu8rVN-EjUv1XIBQ0xWAnv0Rd9gl4q-2Oyxa9vSOEcl0cqONZWAcqAMsDE4CxY/exec";

const YEARS = ["2025","2024","2023"];
const CACHE_KEY="susi_data_v1";
const CACHE_HOUR=8;

/* ================= 상태 ================= */
let DATA=null;
let selected=[];

/* ================= 진행바 ================= */
let fake=0;
const bar=document.getElementById("bar");
const ptext=document.getElementById("ptext");
const timer=setInterval(()=>{
  fake=Math.min(fake+5,90);
  bar.style.width=fake+"%";
},120);

/* ================= 데이터 로딩 ================= */
(async()=>{
  try{
    const cache=localStorage.getItem(CACHE_KEY);
    if(cache){
      const obj=JSON.parse(cache);
      if(Date.now()-obj.t < CACHE_HOUR*3600000){
        DATA=obj.d;
        init();
        return;
      }
    }

    const res=await fetch(GAS_URL,{cache:"no-store"});
    DATA=await res.json();
    localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),d:DATA}));
    init();
  }catch(e){
    ptext.textContent="데이터를 불러오지 못했습니다.";
    console.error(e);
  }finally{
    clearInterval(timer);
    bar.style.width="100%";
    setTimeout(()=>document.querySelector(".progress-wrap").style.display="none",500);
  }
})();

/* ================= UI 초기화 ================= */
function init(){
  const univ=document.getElementById("univ");
  univ.innerHTML="<option>대학 선택</option>";
  Object.keys(DATA[YEARS[0]]).forEach(u=>{
    univ.append(new Option(u,u));
  });
  univ.disabled=false;
  ptext.textContent="데이터 로딩 완료";
}

/* ================= 드롭다운 ================= */
univ.onchange=()=>{
  dept.innerHTML="<option>모집단위</option>";
  type.innerHTML="<option>전형</option>";
  detail.innerHTML="<option>세부전형</option>";
  const u=univ.value;
  if(!DATA[YEARS[0]][u])return;
  Object.keys(DATA[YEARS[0]][u]).forEach(d=>{
    dept.append(new Option(d,d));
  });
  dept.disabled=false;
};

dept.onchange=()=>{
  type.innerHTML="<option>전형</option>";
  detail.innerHTML="<option>세부전형</option>";
  const obj=DATA[YEARS[0]][univ.value][dept.value];
  Object.keys(obj).forEach(t=>type.append(new Option(t,t)));
  type.disabled=false;
};

type.onchange=()=>{
  detail.innerHTML="<option>세부전형</option>";
  const obj=DATA[YEARS[0]][univ.value][dept.value][type.value];
  Object.keys(obj).forEach(d=>detail.append(new Option(d,d)));
  detail.disabled=false;
  add.disabled=false;
};

/* ================= 비교 추가 ================= */
add.onclick=()=>{
  if(selected.length>=3)return;
  selected.push({
    u:univ.value,
    d:dept.value,
    t:type.value,
    s:detail.value
  });
  render();
};

/* ================= 렌더 ================= */
function render(){
  const area=document.getElementById("cards");
  area.innerHTML="";
  selected.forEach((x,i)=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-head">
        ${x.u} · ${x.d}<span class="remove" onclick="del(${i})">✕</span>
      </div>
      <div class="thermos">
        ${YEARS.map(y=>thermo(x,y)).join("")}
      </div>
    `;
    area.append(card);
  });
}

function del(i){
  selected.splice(i,1);
  render();
}

/* ================= 온도계 ================= */
function thermo(x,y){
  const d=DATA[y]?.[x.u]?.[x.d]?.[x.t]?.[x.s];
  if(!d||!d.cut70)return `<div class="thermo"></div>`;
  const v=Math.max(0,Math.min(100,(9-d.cut70)/8*100));
  return `
  <svg class="thermo" viewBox="0 0 80 260">
    <defs>
      <linearGradient id="g${y}" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="50%" stop-color="#facc15"/>
        <stop offset="100%" stop-color="#ef4444"/>
      </linearGradient>
    </defs>
    <rect x="30" y="10" width="20" height="220" rx="10" fill="#e5e7eb"/>
    <rect x="30" y="${230-v*2.2}" width="20" height="${v*2.2}" rx="10" fill="url(#g${y})">
      <animate attributeName="height" from="0" to="${v*2.2}" dur="0.8s"/>
    </rect>
    <text x="40" y="250" text-anchor="middle" font-size="12">${y}</text>
    <text x="40" y="${230-v*2.2-6}" text-anchor="middle" font-size="11">${d.cut70}</text>
  </svg>`;
}
</script>
</body>
</html>
