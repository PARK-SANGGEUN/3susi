<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 수시 3개년 입시결과 비교 온도계</title>

<style>
:root{
  --blue:#4f9cff;
  --yellow:#ffcc33;
  --red:#ff5b5b;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f4f6fb;
}
.container{
  max-width:1100px;
  margin:40px auto;
  background:#fff;
  border-radius:20px;
  padding:40px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}
h1{margin:0 0 6px}
small{color:#666}
.badge{
  display:inline-block;
  margin:15px 0;
  padding:8px 14px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--yellow),var(--red));
  color:#000;
  font-weight:600;
}
.guide{
  background:#f1f3f5;
  border-radius:12px;
  padding:12px 16px;
  margin:20px 0;
}
.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:15px;
}
select,button{
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}
button{
  background:#ffcc33;
  border:none;
  font-weight:700;
  cursor:pointer;
}
button:disabled{opacity:.5}
.progress-wrap{
  margin-top:15px;
}
.progress{
  height:8px;
  background:#e9ecef;
  border-radius:999px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red));
  transition:width .4s;
}
.status{font-size:14px;margin-top:6px;color:#555}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
  margin-top:30px;
}
.card{
  background:#f9fafc;
  border-radius:16px;
  padding:20px;
}
.card h3{margin:0 0 10px}
.thermo{
  margin-top:10px;
}
.scale{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#666;
}
.thermo-bar{
  height:14px;
  background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red));
  border-radius:999px;
  position:relative;
  margin:6px 0;
}
.marker{
  position:absolute;
  top:-6px;
  width:2px;
  height:26px;
  background:#000;
}
.value{
  font-size:14px;
  font-weight:700;
}
@media(max-width:600px){
  .container{padding:20px}
}
</style>
</head>

<body>
<div class="container">
  <h1>모두의 수시 3개년 입시결과 비교 온도계</h1>
  <small>Copyright@All Teachers</small><br>
  <span class="badge">출처 : 어디가 3개년 입시결과</span>

  <div class="guide">
    ① 대학 → ② 모집단위 → ③ 전형 → ④ 세부전형 선택<br>
    최대 3개 비교 가능 · 2025년 데이터 강조
  </div>

  <div class="controls">
    <select id="univ"><option>로딩 중...</option></select>
    <select id="dept" disabled><option>모집단위</option></select>
    <select id="type" disabled><option>전형</option></select>
    <select id="detail" disabled><option>세부전형</option></select>
    <button id="add" disabled>비교 추가 (최대 3)</button>
  </div>

  <div class="progress-wrap">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">데이터 불러오는 중...</div>
  </div>

  <div class="cards" id="cards"></div>
</div>

<script>
/* ===== 설정 ===== */
const SHEET_ID = "1yLhazEm3wDXpsFsB4wttzK9Rx85KleyOsffTcc4hxTc";
const YEARS = [2025,2024,2023];
let DATA = [];
let selected = [];

/* ===== 진행바 ===== */
let fake = 0;
const bar = document.getElementById("bar");
const status = document.getElementById("status");
const timer = setInterval(()=>{
  fake = Math.min(fake + Math.random()*8, 90);
  bar.style.width = fake + "%";
},300);

/* ===== CSV 로딩 ===== */
async function loadData(){
  for(const year of YEARS){
    const url = `https://opensheet.elk.sh/${SHEET_ID}/${year}`;
    const res = await fetch(url);
    const rows = await res.json();
    rows.forEach(r=>DATA.push({...r,year}));
  }
}
loadData().then(init).catch(()=>{
  status.textContent="데이터 로딩 실패";
});

/* ===== 초기화 ===== */
function init(){
  clearInterval(timer);
  bar.style.width="100%";
  status.textContent="로딩 완료";

  const univSel=document.getElementById("univ");
  const univs=[...new Set(DATA.map(d=>d["대학명"]))];
  univSel.innerHTML="<option>대학 선택</option>"+univs.map(u=>`<option>${u}</option>`).join("");
}

/* ===== 선택 로직 ===== */
const univ=document.getElementById("univ");
const dept=document.getElementById("dept");
const type=document.getElementById("type");
const detail=document.getElementById("detail");
const add=document.getElementById("add");

univ.onchange=()=>{
  const list=[...new Set(DATA.filter(d=>d["대학명"]===univ.value).map(d=>d["모집단위"]))];
  dept.innerHTML="<option>모집단위</option>"+list.map(v=>`<option>${v}</option>`).join("");
  dept.disabled=false;
};

dept.onchange=()=>{
  const list=[...new Set(DATA.filter(d=>d["대학명"]===univ.value && d["모집단위"]===dept.value).map(d=>d["중심전형"]))];
  type.innerHTML="<option>전형</option>"+list.map(v=>`<option>${v}</option>`).join("");
  type.disabled=false;
};

type.onchange=()=>{
  const list=[...new Set(DATA.filter(d=>d["대학명"]===univ.value && d["모집단위"]===dept.value && d["중심전형"]===type.value).map(d=>d["전형명"]))];
  detail.innerHTML="<option>세부전형</option>"+list.map(v=>`<option>${v}</option>`).join("");
  detail.disabled=false;
};

detail.onchange=()=>add.disabled=false;

/* ===== 비교 추가 ===== */
add.onclick=()=>{
  if(selected.length>=3)return;
  const rows=DATA.filter(d=>d["대학명"]===univ.value && d["모집단위"]===dept.value && d["중심전형"]===type.value && d["전형명"]===detail.value);
  selected.push({label:`${univ.value} ${dept.value}`,rows});
  render();
};

/* ===== 렌더 ===== */
function gradeToPos(g){return (10-g)/9*100}

function render(){
  const wrap=document.getElementById("cards");
  wrap.innerHTML="";
  selected.forEach(s=>{
    const d2025=s.rows.find(r=>r.year==2025);
    if(!d2025)return;
    const g=d2025["70%cut"]||d2025["50%cut"];
    const pos=gradeToPos(g||9);
    wrap.innerHTML+=`
      <div class="card">
        <h3>${s.label}</h3>
        <div class="thermo">
          <div class="scale"><span>1</span><span>9</span></div>
          <div class="thermo-bar">
            <div class="marker" style="left:${pos}%"></div>
          </div>
          <div class="value">2025 예상 ${g||"—"}등급</div>
        </div>
      </div>`;
  });
}
</script>
</body>
</html>
