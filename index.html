<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 수시 3개년 입시결과 비교 온도계</title>

<style>
:root{
  --blue:#4a90ff;
  --yellow:#ffd43b;
  --red:#ff5c5c;
  --bg:#f5f7fb;
}
body{
  margin:0;
  font-family: "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,#f7f8ff,#fff);
}
.container{
  max-width:1100px;
  margin:40px auto;
  background:#fff;
  border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
}
h1{margin:0;font-size:32px}
small{color:#555}

.badge{
  display:inline-block;
  margin-top:12px;
  padding:8px 14px;
  border-radius:999px;
  background:linear-gradient(90deg,#ffd43b,#ff6b6b);
  font-weight:700;
}

.guide{
  margin:20px 0;
  padding:14px 18px;
  background:#f1f3f5;
  border-radius:12px;
}

.controls{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-top:16px;
}

select,button{
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:15px;
}

button{
  background:#ffc107;
  border:none;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.progress-wrap{
  margin-top:20px;
}
.progress{
  height:10px;
  border-radius:10px;
  background:#e9ecef;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red));
  transition:width .4s;
}

.status{
  margin-top:8px;
  font-size:14px;
  color:#666;
}

/* 비교 카드 */
.cards{
  margin-top:30px;
  display:grid;
  gap:20px;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
}

.card{
  padding:20px;
  border-radius:20px;
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.card h3{margin:0 0 10px}

/* 온도계 */
.thermo{
  position:relative;
  height:180px;
  width:40px;
  margin:auto;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}
.fill{
  position:absolute;
  bottom:0;
  width:100%;
  height:0%;
  background:linear-gradient(180deg,var(--blue),var(--yellow),var(--red));
  transition:height 1s;
}
.scale{
  position:absolute;
  left:45px;
  bottom:0;
  font-size:12px;
  color:#444;
}
.scale div{
  height:20px;
}
</style>
</head>

<body>
<div class="container">
  <h1>모두의 수시 3개년 입시결과 비교 온도계</h1>
  <small>Copyright@All Teachers</small><br>
  <span class="badge">출처: 어디가 3개년 입시결과</span>

  <div class="guide">
    ① 대학 → ② 모집단위 → ③ 전형 → ④ 세부전형 선택<br>
    최대 3개 비교 가능 · 2025년 데이터 강조
  </div>

  <div class="controls">
    <select id="univ"><option>로딩 중…</option></select>
    <select id="dept" disabled><option>모집단위</option></select>
    <select id="track" disabled><option>전형</option></select>
    <select id="detail" disabled><option>세부전형</option></select>
    <button id="add" disabled>비교 추가 (최대 3)</button>
  </div>

  <div class="progress-wrap">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">데이터 불러오는 중…</div>
  </div>

  <div class="cards" id="cards"></div>
</div>

<script>
/* ===============================
   핵심 포인트:
   1) 첫 로딩: 대학 목록만
   2) 절대 전체 데이터 저장 안 함
   3) localStorage 사용 ❌
================================ */

const GAS_URL = "👉 여기에 Apps Script URL 넣기";

const bar = document.getElementById("bar");
const status = document.getElementById("status");

function setProgress(p, msg){
  bar.style.width = p + "%";
  status.textContent = msg;
}

// 임시 더미 (Apps Script 붙이기 전까지 안 멈추게)
setProgress(20,"대학 목록 불러오는 중…");

setTimeout(()=>{
  const univ = document.getElementById("univ");
  univ.innerHTML = "<option>강원대</option><option>가천대</option>";
  setProgress(100,"선택하세요");
},800);

// 비교 카드 샘플
function addCard(name){
  const c = document.createElement("div");
  c.className="card";
  c.innerHTML=`
    <h3>${name}</h3>
    <div class="thermo">
      <div class="fill" style="height:70%"></div>
      <div class="scale">
        <div>1</div><div>3</div><div>5</div><div>7</div><div>9</div>
      </div>
    </div>
  `;
  document.getElementById("cards").appendChild(c);
}
</script>
</body>
</html>
