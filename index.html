<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 입시결과 3개년 비교 온도계</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --primary:#ffb703;
  --accent:#ff6b6b;
  --blue:#4dabf7;
  --text:#222;
}

body{
  margin:0;
  font-family: "Pretendard","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(180deg,#f2f4ff,#fdf7f7);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:40px auto;
  padding:20px;
}

header{
  background:var(--card);
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.08);
}

h1{
  margin:0;
  font-size:28px;
}

.sub{
  margin-top:6px;
  font-weight:600;
}

.badge{
  display:inline-block;
  margin-top:12px;
  padding:8px 14px;
  border-radius:999px;
  background:linear-gradient(135deg,#ffd166,#ef476f);
  color:#000;
  font-weight:700;
}

.guide{
  margin-top:14px;
  padding:12px 16px;
  background:#f1f3f5;
  border-radius:12px;
  font-size:14px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:20px;
}

select,button{
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:15px;
}

button{
  background:var(--primary);
  border:none;
  font-weight:800;
  cursor:pointer;
}

.compare-area{
  margin-top:30px;
}

.compare-card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.gauges{
  display:flex;
  gap:24px;
  margin-top:16px;
}

.gauge{
  width:90px;
  height:240px;
  background:#e9ecef;
  border-radius:40px;
  position:relative;
  overflow:hidden;
}

.fill{
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:#000;
  font-weight:700;
  font-size:14px;
}

.year{
  text-align:center;
  margin-top:8px;
  font-weight:700;
}

@media(max-width:600px){
  .gauges{justify-content:space-around;}
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>모두의 입시결과 3개년 비교 온도계</h1>
  <div class="sub">Copyright@All Teachers</div>
  <div class="badge">출처: 어디가 3개년 입시결과</div>

  <div class="guide">
    ① 대학 → ② 모집단위 → ③ 전형 → ④ 세부전형 선택<br>
    최대 3개까지 비교 가능 · 2025년 데이터 강조
  </div>

  <div class="controls">
    <select id="year"></select>
    <select id="univ"></select>
    <select id="major"></select>
    <select id="detail"></select>
    <button id="add">비교 추가 (최대 3)</button>
  </div>
</header>

<div class="compare-area" id="compare"></div>

</div>

<script>
const DATA_URL = "https://script.google.com/macros/s/AKfycbz_nkDgCK8-tPgvEFR-QAzzAxE9Dke7udddR68y7CIOEs4JZe8B2VWDvMuu_CdBzzsi/exec";

let RAW = {};
let selected = JSON.parse(localStorage.getItem("compare")||"[]");

fetch(DATA_URL)
.then(r=>r.json())
.then(d=>{
  RAW=d;
  init();
  render();
});

function init(){
  const yearSel = document.getElementById("year");
  yearSel.innerHTML = Object.keys(RAW).map(y=>`<option>${y}</option>`).join("");
  yearSel.onchange = loadUniv;
  loadUniv();
}

function loadUniv(){
  const y = year.value;
  univ.innerHTML = Object.keys(RAW[y]).map(v=>`<option>${v}</option>`).join("");
  loadMajor();
}

function loadMajor(){
  const y=year.value,u=univ.value;
  major.innerHTML = Object.keys(RAW[y][u]).map(m=>`<option>${m}</option>`).join("");
  loadDetail();
}

function loadDetail(){
  const y=year.value,u=univ.value,m=major.value;
  const types = RAW[y][u][m];
  detail.innerHTML="";
  Object.keys(types).forEach(t=>{
    Object.keys(types[t]).forEach(d=>{
      detail.innerHTML+=`<option>${t} / ${d}</option>`;
    });
  });
}

add.onclick=()=>{
  if(selected.length>=3)return alert("최대 3개");
  selected.push({
    year:year.value,
    univ:univ.value,
    major:major.value,
    detail:detail.value
  });
  localStorage.setItem("compare",JSON.stringify(selected));
  render();
};

function render(){
  const box=document.getElementById("compare");
  box.innerHTML="";
  selected.forEach((s,i)=>{
    const [t,d]=s.detail.split(" / ");
    const rec=RAW[s.year][s.univ][s.major][t][d];
    const h=Math.min(100,(10-rec.cut70)*10);
    box.innerHTML+=`
    <div class="compare-card">
      <b>${s.univ} ${s.major}<br>${s.detail}</b>
      <div class="gauges">
        ${["2025","2024","2023"].map(y=>{
          const r=RAW[y]?.[s.univ]?.[s.major]?.[t]?.[d];
          const hh=r?Math.min(100,(10-r.cut70)*10):0;
          return `
          <div>
            <div class="gauge">
              <div class="fill" style="height:${hh}%;background:${y=="2025"?"#ff6b6b":"#4dabf7"}">
                ${r? r.cut70:""}
              </div>
            </div>
            <div class="year">${y}</div>
          </div>`;
        }).join("")}
      </div>
      <button onclick="remove(${i})">삭제</button>
    </div>`;
  });
}

function remove(i){
  selected.splice(i,1);
  localStorage.setItem("compare",JSON.stringify(selected));
  render();
}
</script>
</body>
</html>
