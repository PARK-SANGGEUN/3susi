<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>모두의 수시 3개년 입시결과 비교 온도계</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: #f5f7fb;
  padding: 40px;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 30px;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 20px 40px rgba(0,0,0,.08);
}

.progress {
  height: 8px;
  border-radius: 4px;
  background: #eee;
  overflow: hidden;
  margin-top: 20px;
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#4facfe,#f093fb,#f5576c);
  transition: width .4s ease;
}

select, button {
  padding: 12px;
  margin-top: 12px;
  width: 100%;
}
</style>
</head>

<body>
<div class="card">
  <h1>모두의 수시 3개년 입시결과 비교 온도계</h1>
  <p>Copyright@All Teachers</p>

  <select id="univ">
    <option>로딩 중...</option>
  </select>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <p id="status">데이터 불러오는 중...</p>
</div>

<script>
const API_URL =
  'https://script.google.com/macros/s/AKfycbw4cVu8rVN-EjUv1XIBQ0xWAnv0Rd9gl4q-2Oyxa9vSOEcl0cqONZWAcqAMsDE4CxY/exec';

const bar = document.getElementById('bar');
const status = document.getElementById('status');
const select = document.getElementById('univ');

let fakeProgress = 0;
const timer = setInterval(() => {
  fakeProgress = Math.min(fakeProgress + 10, 90);
  bar.style.width = fakeProgress + '%';
}, 300);

(async function loadData() {
  try {
    const cache = localStorage.getItem('admissionData');
    if (cache) {
      init(JSON.parse(cache));
      return;
    }

    const res = await fetch(API_URL);
    const data = await res.json();

    localStorage.setItem('admissionData', JSON.stringify(data));
    init(data);

  } catch (e) {
    status.textContent = '데이터 로딩 실패';
    console.error(e);
  }
})();

function init(data) {
  clearInterval(timer);
  bar.style.width = '100%';
  status.textContent = '로딩 완료';

  const set = new Set();
  Object.values(data).forEach(year =>
    year.forEach(r => set.add(r.대학명))
  );

  select.innerHTML = '';
  [...set].sort().forEach(u => {
    const o = document.createElement('option');
    o.textContent = u;
    select.appendChild(o);
  });
}
</script>
</body>
</html>
